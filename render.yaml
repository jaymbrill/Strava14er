services:
  - type: web
    name: colorado-14er-tracker
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: colorado-14er-db
          property: connectionString
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: colorado-14er-db
    plan: free
    databaseName: fourteeners
